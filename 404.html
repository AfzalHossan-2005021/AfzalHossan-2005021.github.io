<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Afzal Hossan</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>

    <header class="header">
      <div class="container header__inner">
        <a href="/" class="brand" aria-label="Home">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__text">Afzal Hossan</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
        </nav>
      </div>
    </header>

    <main id="content" class="main">
      <section class="hero" aria-label="Not found" style="min-height: 60vh; display: flex; align-items: center">
        <div class="container" style="text-align: center">
          <h1 style="font-size: 72px; margin-bottom: 8px">404</h1>
          <p class="hero__headline">This page doesn't exist.</p>
          <div class="hero__actions" style="justify-content: center; margin-top: 24px">
            <a class="btn btn--primary" href="/">Go Home</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p class="muted">&copy; <span id="y"></span> Afzal Hossan</p>
        <a class="muted" href="/">Home</a>
      </div>
    </footer>

    <script>
      document.getElementById("y").textContent = String(
        new Date().getFullYear()
      );
    </script>
  </body>
</html>
